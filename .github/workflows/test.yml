name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: docker build -t leapmotor-abrp-test .
      - run: docker run --rm --network none --entrypoint sh leapmotor-abrp-test /app/scripts/container_smoke_test.sh
      - run: docker run --rm --network none --entrypoint python leapmotor-abrp-test -m unittest discover -s tests -v

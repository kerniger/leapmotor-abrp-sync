services:
  leapmotor-abrp:
    image: ghcr.io/kerniger/leapmotor-abrp-sync:latest
    pull_policy: always
    container_name: leapmotor-abrp
    restart: unless-stopped
    environment:
      LEAPMOTOR_USERNAME: "deine.email@beispiel.de"
      LEAPMOTOR_PASSWORD: "dein_passwort"
      ABRP_TOKEN: "dein_abrp_token"
      # Set explicitly when the account has multiple vehicles:
      # LEAPMOTOR_VIN: "your_vin"
    volumes:
      - telemetry-state:/app/state

volumes:
  telemetry-state:
